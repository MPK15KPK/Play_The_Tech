name: deploy

# Manual only. Pushing to main does not deploy — someone has to start this
# run deliberately from the Actions tab. Deploying to production is a decision,
# not a side effect of committing.
#
# To go back to deploying on every push to main, restore:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

concurrency:
  group: deploy-playthetech
  cancel-in-progress: false

env:
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Package
        run: |
          zip -r deploy.zip . \
            -x '*.git*' \
            -x 'node_modules/.cache/*' \
            -x '.next/cache/*'

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: deploy.zip
          retention-days: 5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: deploy.zip

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Runs from GitHub's runners, i.e. outside Azure — which is the only place
      # a WAF rule blocking AI crawlers actually shows up. LAUNCH-CHECKLIST §1.
      - name: Smoke test production
        run: node scripts/smoke.mjs ${{ vars.SITE_URL }}
